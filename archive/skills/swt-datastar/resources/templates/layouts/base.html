<!-- Base Layout — Datastar Skill

     This is the root layout that all pages extend.
     Includes Datastar script, CSS tokens, and component styles.

     In your template engine:
     - Go/Templ: {{ template "base" . }}
     - Python/Jinja: {% extends "layouts/base.html" %}
     - PHP/Laravel: @extends('layouts.base')
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} — My App</title>

  <!-- Design System -->
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">

  <!-- Datastar -->
  <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@1.0.0-beta.11/bundles/datastar.js"></script>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>
  <!-- Initialize global signals -->
  <div data-signals="{sidebarOpen: false, toastMessage: '', showModal: false}"></div>

  <div style="display: flex; min-height: 100vh;">
    <!-- Sidebar -->
    <aside 
      class="sidebar"
      data-class:sidebar-collapsed="!$sidebarOpen"
      style="transition: width var(--duration-normal) var(--ease-out);">
      <div class="sidebar-header">
        <div class="sidebar-brand">My App</div>
      </div>
      <nav>
        <ul class="nav" style="flex-direction: column; align-items: stretch;">
          <li>
            <a href="/" class="nav-link active">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              Dashboard
            </a>
          </li>
          <li>
            <a href="/projects" class="nav-link">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
              Projects
            </a>
          </li>
          <li>
            <a href="/settings" class="nav-link">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
              Settings
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content -->
    <main style="flex: 1; min-width: 0;">
      <!-- Top Header -->
      <header style="height: 4rem; border-bottom: 1px solid var(--color-border); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-6); background: var(--color-bg);">
        <div class="row row-sm">
          <button 
            class="btn btn-sm btn-icon btn-ghost"
            data-on:click="$sidebarOpen = !$sidebarOpen"
            aria-label="Toggle sidebar">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 class="heading-4" style="margin: 0;">{{ .Title }}</h1>
        </div>
        <div class="row row-sm">
          <button class="btn btn-sm btn-icon btn-ghost" aria-label="Notifications">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          </button>
          <div style="width: 32px; height: 32px; border-radius: var(--radius-full); background: var(--color-primary); display: flex; align-items: center; justify-content: center; color: var(--color-text-on-primary); font-weight: var(--weight-semibold); font-size: var(--text-sm);">U</div>
        </div>
      </header>

      <!-- Page Content -->
      <div style="padding: var(--space-6);">
        {{ template "content" . }}
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div 
    role="status" 
    aria-live="polite"
    style="position: fixed; bottom: var(--space-6); right: var(--space-6); z-index: var(--z-toast);"
    data-show="$toastMessage">
    <div class="alert alert-success" style="box-shadow: var(--shadow-lg);">
      <span data-text="$toastMessage"></span>
      <button class="btn btn-sm btn-icon btn-ghost" data-on:click="$toastMessage = ''" aria-label="Dismiss">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </div>
</body>
</html>
