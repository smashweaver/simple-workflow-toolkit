<!-- Alert / Toast / Notification — Datastar Skill -->

<!-- Inline Alert -->
<div class="alert alert-info">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
  <div>
    <div style="font-weight: var(--weight-medium);">Information</div>
    <div class="text-sm" style="margin-top: var(--space-1);">This is an informational message.</div>
  </div>
</div>

<!-- Success Alert -->
<div class="alert alert-success" data-show="$saveSuccess">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
  <span>Changes saved successfully!</span>
</div>

<!-- Error Alert -->
<div class="alert alert-danger" data-show="$formError">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
  <span data-text="$formError"></span>
</div>

<!-- Toast (fixed position, auto-dismiss) -->
<div 
  role="status" 
  aria-live="polite"
  style="position: fixed; bottom: var(--space-6); right: var(--space-6); z-index: var(--z-toast);"
  data-show="$toastMessage">
  <div class="alert alert-success" style="box-shadow: var(--shadow-lg);">
    <span data-text="$toastMessage"></span>
    <button class="btn btn-sm btn-icon btn-ghost" data-on:click="$toastMessage = ''" aria-label="Dismiss">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
</div>
