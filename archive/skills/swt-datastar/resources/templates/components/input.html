<!-- Input Component — Datastar Skill

     Usage: Copy-paste and modify the type, name, and label.
-->

<!-- Text Input -->
<div class="form-group">
  <label for="username" class="label">Username</label>
  <input 
    id="username"
    type="text"
    class="input"
    placeholder="Enter your username"
    data-bind="username"
    data-attr:required="true" />
  <p class="hint hint-error" data-show="$usernameError" data-text="$usernameError"></p>
</div>

<!-- Email Input -->
<div class="form-group">
  <label for="email" class="label">Email</label>
  <input 
    id="email"
    type="email"
    class="input"
    placeholder="you@example.com"
    data-bind="email"
    data-attr:required="true" />
</div>

<!-- Password Input -->
<div class="form-group">
  <label for="password" class="label">Password</label>
  <input 
    id="password"
    type="password"
    class="input"
    placeholder="••••••••"
    data-bind="password" />
</div>

<!-- Select Dropdown -->
<div class="form-group">
  <label for="role" class="label">Role</label>
  <select id="role" class="select" data-bind="role">
    <option value="">Select a role</option>
    <option value="admin">Admin</option>
    <option value="editor">Editor</option>
    <option value="viewer">Viewer</option>
  </select>
</div>

<!-- Textarea -->
<div class="form-group">
  <label for="bio" class="label">Bio</label>
  <textarea 
    id="bio"
    class="textarea"
    placeholder="Tell us about yourself..."
    data-bind="bio"></textarea>
</div>

<!-- Checkbox -->
<div class="row row-sm">
  <input 
    id="agree"
    type="checkbox"
    class="checkbox"
    data-bind="agreed" />
  <label for="agree" class="text-sm">I agree to the terms</label>
</div>

<!-- Form Row (side by side) -->
<div class="form-row">
  <div class="form-group">
    <label for="firstName" class="label">First Name</label>
    <input id="firstName" type="text" class="input" data-bind="firstName" />
  </div>
  <div class="form-group">
    <label for="lastName" class="label">Last Name</label>
    <input id="lastName" type="text" class="input" data-bind="lastName" />
  </div>
</div>
